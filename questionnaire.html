<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transnet Connect — Stakeholder Questionnaire</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f3f3f1}
    .public-q-shell{min-height:100vh}
    .public-q-head{background:#242628;color:#fff;padding:18px clamp(18px,4vw,54px);display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:4px solid #d4292e}
    .public-q-brand{display:flex;align-items:center;gap:12px}.public-q-brand .brand-mark{background:#d4292e;color:#fff}
    .public-q-head a{color:#c8ed6a;text-decoration:none;font-size:12px;font-weight:800}
    .public-q-main{max-width:1220px;margin:auto;padding:30px clamp(16px,3vw,32px) 50px}
    .public-q-title{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}
    .public-q-title h1{margin:5px 0 7px;font-size:clamp(28px,4vw,42px)}.public-q-title p{margin:0;color:#707478;max-width:760px;line-height:1.55}
    .public-q-card{background:#fff;border:1px solid #e6eaf0;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(20,42,75,.08)}
    .public-q-bar{padding:12px 16px;background:#fbfbfa;border-bottom:1px solid #e6eaf0;display:flex;justify-content:space-between;font-size:12px}
    .public-q-bar a{color:#d4292e;font-weight:800;text-decoration:none}.public-q-card iframe{width:100%;height:1080px;border:0;display:block}
    @media(max-width:700px){.public-q-head,.public-q-title,.public-q-bar{align-items:flex-start;flex-direction:column}.public-q-card iframe{height:1180px}}
  </style>
</head>
<body>
<div class="public-q-shell">
  <header class="public-q-head">
    <div class="public-q-brand">
      <div class="brand-mark">TN</div>
      <div><div class="brand-name">TRANSNET <span style="color:#7DBE00">CONNECT</span></div><div class="brand-sub">Stakeholder Management Connector</div></div>
    </div>
    <!-- <a href="index.html">Internal platform →</a> -->
  </header>
  <main class="public-q-main">
    <div class="public-q-title">
      <div><div class="section-label">Welcome</div><h1>HELP US SERVE YOU BETTER</h1><p>SHARE YOUR FEEDBACK BELOW</p></div>
    </div>
    <div class="public-q-card">
      <div class="public-q-bar"><span><span class="live-dot" style="display:inline-block;margin-right:8px"></span>Live questionnaire</span><a href="https://forms.zohopublic.com/transnetone/form/transnetconnect/formperma/pQ4bEgYNO5gnGRDSUN-nBvpujm5sdA6lxNChJlo7reY?zf_lang=en" target="_blank" rel="noopener">Open directly in Zoho ↗</a></div>
      <iframe title="Transnet Connect Questionnaire" src="https://forms.zohopublic.com/transnetone/form/transnetconnect/formperma/pQ4bEgYNO5gnGRDSUN-nBvpujm5sdA6lxNChJlo7reY?zf_lang=en" loading="lazy" allow="camera; microphone"></iframe>
    </div>
  </main>
</div>
</body>
</html>
